packages:
  - "."

minimumReleaseAge: 360
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude:
  - semver@6.3.1

overrides:
  # Dedupe KaTeX to one instance so the mhchem/pu extension import patches the
  # same katex that BOTH surfaces render with (TipTap docs and rehype-katex
  # chat), instead of only the app copy. rehype-katex pulls 0.16 otherwise.
  katex: 0.18.4
  dompurify: 3.4.12
  # drizzle-kit reaches esbuild through the deprecated @esbuild-kit/* packages,
  # which pin 0.18.20 — under the advisory range for GHSA esbuild <= 0.24.2.
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10

peerDependencyRules:
  allowedVersions:
    "@babel/helper-create-class-features-plugin>@babel/core": 7.29.0
    "@babel/helper-plugin-utils>@babel/core": 7.29.0
    "@babel/helper-replace-supers>@babel/core": 7.29.0
    "@babel/plugin-proposal-decorators>@babel/core": 7.29.0
    "@babel/plugin-syntax-decorators>@babel/core": 7.29.0
    "@cloudflare/think>vite": 0.2.9
    "@cloudflare/vite-plugin>vite": 0.2.9
    "@rolldown/plugin-babel>vite": 0.2.9
    "@tailwindcss/typography>tailwindcss": 4.3.1
    "@tailwindcss/vite>vite": 0.2.9
    "@tanstack/devtools-vite>vite": 0.2.9
    "@tanstack/react-start>vite": 0.2.9
    "@tanstack/router-plugin>vite": 0.2.9
    "@tanstack/start-plugin-core>vite": 0.2.9
    "@tiptap/extension-mathematics>katex": 0.18.4
    "@vitejs/plugin-react>vite": 0.2.9
    "@vitest/mocker>vite": 0.2.9
    "agents>vite": 0.2.9
    "vitefu>vite": 0.2.9
    "vitest>vite": 0.2.9
    "zod-validation-error>zod": 4.4.3

allowBuilds:
  "@mongodb-js/zstd": true
  "@posthog/cli": true
  core-js: true
  core-js-pure: true
  esbuild: true
  msw: true
  node-liblzma: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/codemode@0.5.0"
  - "@cloudflare/shell@0.4.3"
  - "@cloudflare/think@0.15.0"
  - agents@0.19.0
  - "@voidzero-dev/vite-plus-core@0.2.6"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.6"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.6"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.6"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.6"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.6"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.6"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.6"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.6"
  - vite-plus@0.2.6

patchedDependencies:
  "@cloudflare/think@0.15.0": patches/@cloudflare__think@0.15.0.patch
  "@embedpdf/plugin-zoom@2.15.0": patches/@embedpdf__plugin-zoom@2.15.0.patch
  agents@0.19.0: patches/agents@0.19.0.patch
